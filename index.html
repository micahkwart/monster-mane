<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Mane - 3D Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #stats {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
        }
        
        #health-bar {
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        #health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff6b6b);
            transition: width 0.3s;
        }
        
        #powers {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        
        .power {
            width: 60px;
            height: 60px;
            background: rgba(0, 100, 255, 0.8);
            border: 3px solid #fff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .power:hover {
            transform: scale(1.1);
            background: rgba(0, 150, 255, 0.9);
        }
        
        .power.cooldown {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .power-key {
            font-size: 18px;
            font-weight: bold;
        }
        
        #shop {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border-radius: 15px;
            border: 3px solid #ffd700;
            display: none;
            pointer-events: auto;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        #shop.active {
            display: block;
        }
        
        #shop h2 {
            color: #ffd700;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .shop-item {
            background: rgba(50, 50, 50, 0.8);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .shop-item button {
            padding: 10px 20px;
            background: #ffd700;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .shop-item button:hover {
            background: #ffed4e;
            transform: scale(1.05);
        }
        
        .shop-item button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        
        #close-shop {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4444;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 15px;
            border: 3px solid #ff0000;
            display: none;
            pointer-events: auto;
            text-align: center;
        }
        
        #game-over.active {
            display: block;
        }
        
        #game-over h2 {
            color: #ff0000;
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        #game-over p {
            color: white;
            font-size: 24px;
            margin: 10px 0;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 15px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        
        #restart-btn:hover {
            background: #45a049;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }
        
        #controls h3 {
            margin-bottom: 10px;
            color: #ffd700;
        }
        
        #controls p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="stats">
            <div>Health: <span id="health-text">100</span>/100</div>
            <div id="health-bar">
                <div id="health-fill" style="width: 100%"></div>
            </div>
            <div>Score: <span id="score">0</span></div>
            <div>Coins: <span id="coins">0</span></div>
        </div>
        
        <div id="controls">
            <h3>Controls</h3>
            <p>WASD - Move</p>
            <p>Arrow Keys - Look</p>
            <p>1-0 - Use Powers</p>
            <p>B - Open Shop</p>
        </div>
        
        <div id="powers"></div>
        
        <div id="shop">
            <button id="close-shop">X</button>
            <h2>🛒 Shop</h2>
            <div id="shop-items"></div>
        </div>
        
        <div id="game-over">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <p>Enemies Defeated: <span id="enemies-defeated">0</span></p>
            <button id="restart-btn">Restart Game</button>
        </div>
    </div>
    
    <script>
        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Game state
        const game = {
            health: 100,
            maxHealth: 100,
            score: 0,
            coins: 0,
            enemiesDefeated: 0,
            isGameOver: false,
            isPaused: false,
            player: {
                x: 0,
                y: 0,
                z: 0,
                angle: 0,
                verticalAngle: 0,
                speed: 0.1
            }
        };
        
        // Powers configuration
        const powers = [
            { id: 1, name: 'Fireball', key: '1', cooldown: 1000, damage: 20, color: '#ff4400', description: 'Launch a fireball' },
            { id: 2, name: 'Ice Blast', key: '2', cooldown: 1500, damage: 15, color: '#00ddff', description: 'Freeze enemies' },
            { id: 3, name: 'Lightning', key: '3', cooldown: 2000, damage: 30, color: '#ffff00', description: 'Strike with lightning' },
            { id: 4, name: 'Heal', key: '4', cooldown: 5000, damage: -30, color: '#00ff00', description: 'Restore health' },
            { id: 5, name: 'Shield', key: '5', cooldown: 10000, damage: 0, color: '#8800ff', description: 'Temporary shield' },
            { id: 6, name: 'Bomb', key: '6', cooldown: 3000, damage: 40, color: '#ff0000', description: 'Area explosion' },
            { id: 7, name: 'Poison', key: '7', cooldown: 2500, damage: 25, color: '#00ff88', description: 'Poison damage' },
            { id: 8, name: 'Wind', key: '8', cooldown: 1800, damage: 18, color: '#aaddff', description: 'Push enemies back' },
            { id: 9, name: 'Earth', key: '9', cooldown: 3500, damage: 35, color: '#885522', description: 'Rock projectile' },
            { id: 0, name: 'Ultimate', key: '0', cooldown: 15000, damage: 100, color: '#ff00ff', description: 'Devastating attack' }
        ];
        
        const powerCooldowns = new Map();
        let shieldActive = false;
        let shieldEndTime = 0;
        
        // Shop items
        const shopItems = [
            { id: 1, name: 'Health Potion', cost: 50, effect: () => { game.health = Math.min(game.maxHealth, game.health + 50); updateUI(); } },
            { id: 2, name: 'Max Health +20', cost: 100, effect: () => { game.maxHealth += 20; game.health += 20; updateUI(); } },
            { id: 3, name: 'Damage Boost', cost: 150, effect: () => { powers.forEach(p => p.damage = Math.floor(p.damage * 1.2)); } },
            { id: 4, name: 'Speed Boost', cost: 80, effect: () => { game.player.speed *= 1.2; } },
            { id: 5, name: 'Cooldown Reduction', cost: 200, effect: () => { powers.forEach(p => p.cooldown = Math.floor(p.cooldown * 0.8)); } }
        ];
        
        // Enemies and projectiles
        const enemies = [];
        const projectiles = [];
        let lastEnemySpawn = 0;
        
        // Input handling
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            if (game.isGameOver) return;
            keys[e.key.toLowerCase()] = true;
            
            if (e.key.toLowerCase() === 'b') {
                toggleShop();
            }
            
            if (!game.isPaused) {
                const num = e.key;
                if ('1234567890'.includes(num)) {
                    const powerIndex = num === '0' ? 9 : parseInt(num) - 1;
                    usePower(powers[powerIndex]);
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });
        
        // Enemy creation
        function createEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const distance = 20 + Math.random() * 10;
            enemies.push({
                x: game.player.x + Math.cos(angle) * distance,
                y: 0,
                z: game.player.z + Math.sin(angle) * distance,
                health: 50,
                speed: 0.03
            });
        }
        
        // Power usage
        function usePower(power) {
            const now = Date.now();
            const lastUsed = powerCooldowns.get(power.id) || 0;
            
            if (now - lastUsed < power.cooldown) {
                return;
            }
            
            powerCooldowns.set(power.id, now);
            
            if (power.name === 'Heal') {
                game.health = Math.min(game.maxHealth, game.health - power.damage);
                updateUI();
            } else if (power.name === 'Shield') {
                shieldActive = true;
                shieldEndTime = now + 5000;
            } else if (power.name === 'Bomb') {
                enemies.forEach(enemy => {
                    const dx = enemy.x - game.player.x;
                    const dz = enemy.z - game.player.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    if (dist < 10) {
                        enemy.health -= power.damage;
                    }
                });
            } else {
                projectiles.push({
                    x: game.player.x,
                    y: 1,
                    z: game.player.z,
                    vx: Math.cos(game.player.angle) * 0.3,
                    vz: Math.sin(game.player.angle) * 0.3,
                    damage: power.damage,
                    color: power.color,
                    life: 200
                });
            }
            
            updatePowerUI();
        }
        
        // UI Functions
        function updateUI() {
            document.getElementById('health-text').textContent = Math.max(0, Math.floor(game.health));
            document.getElementById('health-fill').style.width = Math.max(0, (game.health / game.maxHealth) * 100) + '%';
            document.getElementById('score').textContent = game.score;
            document.getElementById('coins').textContent = game.coins;
        }
        
        function updatePowerUI() {
            const powersContainer = document.getElementById('powers');
            powersContainer.innerHTML = '';
            
            const now = Date.now();
            powers.forEach(power => {
                const powerDiv = document.createElement('div');
                powerDiv.className = 'power';
                
                const lastUsed = powerCooldowns.get(power.id) || 0;
                const timeLeft = Math.max(0, power.cooldown - (now - lastUsed));
                
                if (timeLeft > 0) {
                    powerDiv.classList.add('cooldown');
                    powerDiv.innerHTML = `
                        <div class="power-key">${power.key}</div>
                        <div>${(timeLeft / 1000).toFixed(1)}s</div>
                    `;
                } else {
                    powerDiv.innerHTML = `
                        <div class="power-key">${power.key}</div>
                        <div style="font-size: 10px">${power.name}</div>
                    `;
                }
                
                powerDiv.title = power.description;
                powerDiv.onclick = () => usePower(power);
                powersContainer.appendChild(powerDiv);
            });
        }
        
        function toggleShop() {
            game.isPaused = !game.isPaused;
            const shop = document.getElementById('shop');
            shop.classList.toggle('active');
            
            if (game.isPaused) {
                updateShopUI();
            }
        }
        
        function updateShopUI() {
            const shopItemsContainer = document.getElementById('shop-items');
            shopItemsContainer.innerHTML = '';
            
            shopItems.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'shop-item';
                itemDiv.innerHTML = `
                    <div>
                        <strong>${item.name}</strong><br>
                        Cost: ${item.cost} coins
                    </div>
                    <button onclick="buyItem(${item.id})" ${game.coins < item.cost ? 'disabled' : ''}>
                        Buy
                    </button>
                `;
                shopItemsContainer.appendChild(itemDiv);
            });
        }
        
        window.buyItem = function(itemId) {
            const item = shopItems.find(i => i.id === itemId);
            if (item && game.coins >= item.cost) {
                game.coins -= item.cost;
                item.effect();
                updateShopUI();
                updateUI();
            }
        };
        
        document.getElementById('close-shop').onclick = toggleShop;
        
        function killEnemy(enemy) {
            const index = enemies.indexOf(enemy);
            if (index > -1) {
                enemies.splice(index, 1);
                game.score += 10;
                game.coins += 5;
                game.enemiesDefeated++;
                updateUI();
            }
        }
        
        function damagePlayer(amount) {
            if (shieldActive) return;
            
            game.health -= amount;
            updateUI();
            
            if (game.health <= 0) {
                gameOver();
            }
        }
        
        function gameOver() {
            game.isGameOver = true;
            document.getElementById('final-score').textContent = game.score;
            document.getElementById('enemies-defeated').textContent = game.enemiesDefeated;
            document.getElementById('game-over').classList.add('active');
        }
        
        document.getElementById('restart-btn').onclick = function() {
            location.reload();
        };
        
        // 3D Rendering
        function project3D(x, y, z) {
            const dx = x - game.player.x;
            const dy = y - 1;
            const dz = z - game.player.z;
            
            const cosA = Math.cos(game.player.angle);
            const sinA = Math.sin(game.player.angle);
            
            const rx = dx * cosA - dz * sinA;
            const rz = dx * sinA + dz * cosA;
            
            if (rz <= 0.1) return null;
            
            const scale = 400 / rz;
            const screenX = canvas.width / 2 + rx * scale;
            const screenY = canvas.height / 2 - dy * scale;
            const size = scale;
            
            return { x: screenX, y: screenY, size: size, distance: rz };
        }
        
        function drawGame() {
            // Clear and draw sky/ground
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);
            
            // Draw grid
            ctx.strokeStyle = '#196619';
            ctx.lineWidth = 1;
            for (let i = -20; i <= 20; i += 2) {
                const start1 = project3D(i, 0, -20);
                const end1 = project3D(i, 0, 20);
                if (start1 && end1) {
                    ctx.beginPath();
                    ctx.moveTo(start1.x, start1.y);
                    ctx.lineTo(end1.x, end1.y);
                    ctx.stroke();
                }
                
                const start2 = project3D(-20, 0, i);
                const end2 = project3D(20, 0, i);
                if (start2 && end2) {
                    ctx.beginPath();
                    ctx.moveTo(start2.x, start2.y);
                    ctx.lineTo(end2.x, end2.y);
                    ctx.stroke();
                }
            }
            
            // Draw enemies
            const sortedEnemies = enemies.map(e => ({
                enemy: e,
                pos: project3D(e.x, e.y + 0.5, e.z)
            })).filter(e => e.pos).sort((a, b) => b.pos.distance - a.pos.distance);
            
            sortedEnemies.forEach(({enemy, pos}) => {
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(pos.x - pos.size / 2, pos.y - pos.size, pos.size, pos.size);
                
                // Health bar
                const healthPercent = enemy.health / 50;
                ctx.fillStyle = '#333';
                ctx.fillRect(pos.x - pos.size / 2, pos.y - pos.size - 10, pos.size, 5);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(pos.x - pos.size / 2, pos.y - pos.size - 10, pos.size * healthPercent, 5);
            });
            
            // Draw projectiles
            projectiles.forEach(proj => {
                const pos = project3D(proj.x, proj.y, proj.z);
                if (pos) {
                    ctx.fillStyle = proj.color;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, pos.size * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            // Draw crosshair
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            ctx.beginPath();
            ctx.moveTo(cx - 10, cy);
            ctx.lineTo(cx + 10, cy);
            ctx.moveTo(cx, cy - 10);
            ctx.lineTo(cx, cy + 10);
            ctx.stroke();
            
            // Draw shield effect
            if (shieldActive) {
                ctx.strokeStyle = '#8800ff';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, 100, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
        
        // Game loop
        function update() {
            if (game.isGameOver || game.isPaused) {
                drawGame();
                requestAnimationFrame(update);
                return;
            }
            
            const now = Date.now();
            
            // Update shield
            if (shieldActive && now > shieldEndTime) {
                shieldActive = false;
            }
            
            // Player movement
            if (keys['w']) {
                game.player.x += Math.cos(game.player.angle) * game.player.speed;
                game.player.z += Math.sin(game.player.angle) * game.player.speed;
            }
            if (keys['s']) {
                game.player.x -= Math.cos(game.player.angle) * game.player.speed;
                game.player.z -= Math.sin(game.player.angle) * game.player.speed;
            }
            if (keys['a']) {
                game.player.x -= Math.cos(game.player.angle + Math.PI / 2) * game.player.speed;
                game.player.z -= Math.sin(game.player.angle + Math.PI / 2) * game.player.speed;
            }
            if (keys['d']) {
                game.player.x += Math.cos(game.player.angle + Math.PI / 2) * game.player.speed;
                game.player.z += Math.sin(game.player.angle + Math.PI / 2) * game.player.speed;
            }
            
            // Camera rotation
            if (keys['arrowleft']) game.player.angle -= 0.05;
            if (keys['arrowright']) game.player.angle += 0.05;
            
            // Spawn enemies
            if (now - lastEnemySpawn > 2000 && enemies.length < 15) {
                createEnemy();
                lastEnemySpawn = now;
            }
            
            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                
                const dx = game.player.x - enemy.x;
                const dz = game.player.z - enemy.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                
                if (dist > 0.1) {
                    enemy.x += (dx / dist) * enemy.speed;
                    enemy.z += (dz / dist) * enemy.speed;
                }
                
                if (dist < 1.5) {
                    damagePlayer(0.5);
                }
                
                if (enemy.health <= 0) {
                    killEnemy(enemy);
                }
            }
            
            // Update projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                proj.x += proj.vx;
                proj.z += proj.vz;
                proj.life--;
                
                if (proj.life <= 0) {
                    projectiles.splice(i, 1);
                    continue;
                }
                
                // Check collision with enemies
                for (let j = 0; j < enemies.length; j++) {
                    const enemy = enemies[j];
                    const dx = proj.x - enemy.x;
                    const dz = proj.z - enemy.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    
                    if (dist < 1) {
                        enemy.health -= proj.damage;
                        projectiles.splice(i, 1);
                        break;
                    }
                }
            }
            
            drawGame();
            updatePowerUI();
            requestAnimationFrame(update);
        }
        
        // Initialize
        updateUI();
        updatePowerUI();
        update();
    </script>
</body>
</html>
